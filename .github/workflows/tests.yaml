name: Run Donobu Flows

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC
  workflow_dispatch:
    inputs:
      donobu_run_id:
        description: 'Override the Donobu run ID verbatim. Paste the rerun-of:<original-run-id>:<epoch> value from the Donobu dashboard''s "Copy CI re-run command" so this dispatch reports as a re-run of that run. Leave blank for the standard composed ID.'
        required: false
        type: string

permissions:
  contents: write # the heal branch
  pull-requests: write # the pull request Donobu's heal agent opens

jobs:
  run-donobu-flows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: pnpm

      - name: Install Dependencies
        env:
          DONOBU_API_KEY: ${{ secrets.DONOBU_API_KEY }}
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps

      # DONOBU_API_KEY also persists results to Donobu Cloud; the reporters then
      # link the hosted Test Runs page for DONOBU_RUN_ID and add the link to
      # this workflow run on their own, so DONOBU_REPORT_URL stays unset.
      # run_attempt keeps a re-run of this workflow from merging into the
      # original run's results.
      #
      # When tests fail, --auto-heal puts Donobu's heal agent on them: it
      # diagnoses each failure, fixes the tests that are out of date, and
      # Donobu re-runs them. On a run that is not itself for a pull request,
      # the agent then opens a pull request with the fix from
      # donobu/heal/<branch>, through the GitHub command-line tool, which
      # reads GH_TOKEN.
      - name: Run Playwright Tests
        id: run_tests
        continue-on-error: true
        env:
          DONOBU_API_KEY: ${{ secrets.DONOBU_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          DONOBU_RUN_ID: ${{ inputs.donobu_run_id || format('playwright-flows:{0}:{1}:{2}:{3}', github.ref_name, github.event_name, github.run_id, github.run_attempt) }}
          DONOBU_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: pnpm exec donobu test --auto-heal

      - name: Save Test Reports as Artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 3

      - name: Fail if Donobu Tests Failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
