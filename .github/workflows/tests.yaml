name: Run Donobu Flows

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC
  workflow_dispatch:
    inputs:
      donobu_run_id:
        description: 'Override the Donobu run id verbatim. Paste the rerun-of:<original-run-id>:<epoch> value from the Donobu dashboard''s "Copy CI re-run command" so this dispatch reports as a re-run of that run. Leave blank for the standard composed id.'
        required: false
        type: string

permissions:
  contents: write # auto-heal PR branch and the gh-pages push
  pull-requests: write

jobs:
  run-donobu-flows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: pnpm

      - name: Install Dependencies
        env:
          DONOBU_API_KEY: ${{ secrets.DONOBU_API_KEY }}
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps

      # DONOBU_API_KEY also persists results to Donobu Cloud; the reporters then
      # link the hosted Test Runs page for DONOBU_RUN_ID and add the link to
      # this workflow run on their own, so DONOBU_REPORT_URL stays unset. The
      # public copy of the report is the GitHub Pages site published below.
      # run_attempt keeps a re-run of this workflow from merging into the
      # original run's results.
      - name: Run Playwright Tests
        id: run_tests
        continue-on-error: true
        env:
          DONOBU_API_KEY: ${{ secrets.DONOBU_API_KEY }}
          DONOBU_RUN_ID: ${{ inputs.donobu_run_id || format('playwright-flows:{0}:{1}:{2}:{3}', github.ref_name, github.event_name, github.run_id, github.run_attempt) }}
          DONOBU_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: pnpm exec donobu test --auto-heal

      - name: Save Test Reports as Artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 3

      - name: Publish the HTML report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test-results

      # Open a self-healing PR with whatever auto-heal changed. Donobu writes
      # the PR body to test-results/auto-heal-pr-body.md when it heals tests;
      # the hashFiles() guard skips PR creation when no body is present.
      - name: Create Pull Request for Test Fixes (if any)
        if: ${{ github.event_name != 'pull_request' && hashFiles('test-results/auto-heal-pr-body.md') }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Donobu auto-heal: fix failing tests"
          title: "Donobu auto-heal: Test fixes for ${{ github.ref_name }}"
          body-path: test-results/auto-heal-pr-body.md
          branch: fix-playwright-tests-for-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          labels: donobu, auto-heal
          delete-branch: true

      - name: Fail if Donobu Tests Failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
